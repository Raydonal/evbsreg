url: https://Raydonal.github.io/evbsreg

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    primary: "#1b7837"

home:
  title: Local influence diagnostics for the EVBS regression model
  description: >
    Joint maximum likelihood estimation, conformal normal curvature
    diagnostics, residual analysis, and Monte Carlo utilities for the
    Extreme-Value Birnbaum-Saunders regression model.

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/Raydonal/evbsreg

reference:
  - title: "Model fitting"
    desc: "Joint maximum likelihood estimation of the EVBS regression model."
    contents:
      - evbsreg.fit
      - print.evbsreg
  - title: "Local influence diagnostics"
    desc: >
      Conformal normal curvature diagnostics and their visualization.
    contents:
      - cnc_diagnostics
      - plot_cnc
      - plot_normalized_eigenvalues
      - plot_aggregate_contributions
  - title: "Residual analysis"
    desc: "Residuals and the simulation envelope for model adequacy."
    contents:
      - rqrandomized
      - rcoxsnell
      - envelope_qq
  - title: "Densities"
    desc: "EVBS and log-EVBS density values and plots."
    contents:
      - generate_evbs_data
      - generate_logevbs_data
      - plot_evbs_alpha
      - plot_evbs_gama
      - plot_logevbs_alpha
      - plot_logevbs_gama
  - title: "Simulation"
    desc: "Random generation and the Monte Carlo study."
    contents:
      - revbs
      - evbsreg.fit.mc
  - title: "Data"
    contents:
      - itajai

articles:
  - title: "Get started"
    navbar: ~
    contents:
      - evbsreg

footer:
  structure:
    left: developed_by
    right: built_with
